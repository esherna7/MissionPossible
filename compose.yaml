services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mission_possible
      POSTGRES_USER: mission_possible
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission_possible -d mission_possible"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: